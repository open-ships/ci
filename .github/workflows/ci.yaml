name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache: false

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # Exercise the reusable workflow at this commit before publishing a new tag.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/check-go.yaml
    with:
      runner: ${{ matrix.os }}
      cache: false
      setup-just: true
      environment: '{"CHECK_MESSAGE":"shared workflow smoke test"}'
      artifact-name: smoke-${{ matrix.os }}
      artifact-path: smoke/evidence.txt
      command: |
        test "$OPEN_SHIPS_CI" = true
        test "$GOTOOLCHAIN" = local
        test "$CHECK_MESSAGE" = 'shared workflow smoke test'
        just --version
        mkdir smoke
        cd smoke
        go mod init example.com/ci-smoke
        printf 'package smoke\nimport "testing"\nfunc TestSmoke(t *testing.T) {}\n' > smoke_test.go
        go test ./...
        go version > evidence.txt

  smoke-gate:
    if: ${{ always() }}
    needs: [actionlint, smoke]
    uses: ./.github/workflows/gate.yaml
    with:
      results: ${{ toJSON(needs) }}
